<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Therma - AI-Powered Heat Intelligence</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body class="bg-background text-on-background font-body-md h-screen w-screen overflow-hidden antialiased selection:bg-primary-container selection:text-on-primary-container">
  <!-- ============================= MOBILE TOP BAR ============================= -->
  <header id="mobile-topbar" class="md:hidden fixed top-0 left-0 right-0 flex justify-between items-center px-6 z-50 bg-surface/80 dark:bg-inverse-surface/80 backdrop-blur-xl h-16 shadow-sm border-b border-outline-variant/30 dark:border-outline/20">
    <button id="mobile-menu-btn" class="material-symbols-outlined text-on-surface-variant dark:text-surface-variant p-2 rounded-full active:scale-95 transition-transform" aria-label="Menu">menu</button>
    <div class="flex items-center gap-2">
      <img src="/logo.png" alt="THERMA logo" class="w-7 h-7 object-contain rounded-lg" onerror="this.style.display='none'"/>
      <span class="text-headline-md font-headline-md font-black text-primary dark:text-inverse-primary tracking-tight">Therma</span>
    </div>
    <div class="flex items-center gap-1">
      <button id="mobile-search-btn" class="material-symbols-outlined text-on-surface-variant dark:text-surface-variant p-2 rounded-full active:scale-95 transition-transform" aria-label="Search">search</button>
      <button data-theme-toggle class="material-symbols-outlined text-on-surface-variant dark:text-surface-variant p-2 rounded-full active:scale-95 transition-transform" aria-label="Toggle theme">light_mode</button>
    </div>
  </header>

  <!-- ============================= MOBILE BOTTOM NAV ============================= -->
  <nav id="mobile-bottomnav" class="md:hidden fixed bottom-0 left-0 right-0 flex justify-around items-center bg-surface/90 dark:bg-inverse-surface/90 backdrop-blur-xl h-20 px-2 pb-2 z-40 shadow-[0_-4px_16px_rgba(0,0,0,0.05)] border-t border-outline-variant/20 dark:border-outline/10"></nav>

  <!-- ============================= DRAWER SCRIM ============================= -->
  <div id="drawer-scrim" class="md:hidden fixed inset-0 bg-black/30 z-40 hidden"></div>

  <!-- ============================= DESKTOP SIDEBAR ============================= -->
  <nav id="sidebar" class="hidden md:flex flex-col h-full py-md px-sm z-40 left-0 w-[240px] shrink-0 bg-surface/80 dark:bg-inverse-surface/80 backdrop-blur-xl border-r border-outline-variant/30 dark:border-outline/20 shadow-md transition-all duration-300 overflow-hidden">
    <!-- Header -->
    <div class="flex items-center gap-3 px-3 py-4 mb-4 min-w-[208px]">
      <div class="w-10 h-10 rounded-xl bg-primary-container flex items-center justify-center shrink-0 overflow-hidden">
        <img src="/logo.png" alt="THERMA logo" class="w-full h-full object-contain p-0.5" onerror="this.style.display='none';this.parentElement.querySelector('.logo-fallback').style.display='block';"/>
        <span class="material-symbols-outlined text-on-primary text-xl logo-fallback hidden" style="font-variation-settings:'FILL' 1;">thermostat</span>
      </div>
      <div class="flex flex-col overflow-hidden">
        <span class="text-label-md font-bold text-primary dark:text-inverse-primary truncate">Therma Platform</span>
        <span class="text-[10px] text-on-surface-variant dark:text-surface-variant uppercase tracking-wider font-semibold truncate">Geospatial Intelligence</span>
      </div>
    </div>
    <!-- Main Navigation -->
    <div id="sidebar-nav" class="flex-1 overflow-y-auto pr-2 flex flex-col gap-1 min-w-[208px]"></div>
    <!-- Footer Navigation -->
    <div id="sidebar-footer" class="mt-auto pt-4 border-t border-outline-variant/30 dark:border-outline/20 flex flex-col gap-1 pr-2 min-w-[208px]"></div>
    <!-- CTA -->
    <div class="mt-4 px-2 min-w-[208px]">
      <button id="sidebar-collapse-btn" class="w-full squishy-btn bg-primary text-on-primary py-2.5 rounded-xl text-label-md font-label-md font-semibold flex items-center justify-center gap-2 transition-transform">
        <span class="material-symbols-outlined text-sm">open_in_full</span>
        <span class="collapse-label">Expand View</span>
      </button>
    </div>
  </nav>

  <!-- ============================= MAIN CONTENT CANVAS ============================= -->
  <main id="main" class="flex-1 relative flex flex-col overflow-hidden bg-surface-container-lowest pt-16 md:pt-0 pb-20 md:pb-0">
    <div id="screen" class="flex-1 relative flex flex-col overflow-hidden"></div>

    <!-- Visualization Workspace (auto-hiding) -->
    <section id="viz-workspace" class="viz-workspace hidden absolute left-0 right-0 bottom-0 z-30 mx-auto max-w-5xl px-md pb-md pointer-events-none">
      <div class="glass-panel rounded-2xl pointer-events-auto overflow-hidden">
        <div class="flex items-center justify-between px-md py-xs border-b border-outline-variant/20 dark:border-outline/10">
          <div class="flex items-center gap-2 min-w-0">
            <span class="material-symbols-outlined text-primary dark:text-inverse-primary text-[18px]" id="viz-icon">insights</span>
            <span id="viz-title" class="text-label-md font-label-md font-bold truncate">Analysis</span>
            <span id="viz-source-badge" class="source-badge"></span>
          </div>
          <div class="flex items-center gap-1">
            <button id="viz-expand" class="p-1.5 rounded-lg hover:bg-surface-container text-on-surface-variant" title="Expand"><span class="material-symbols-outlined text-[18px]">open_in_full</span></button>
            <button id="viz-fullscreen" class="p-1.5 rounded-lg hover:bg-surface-container text-on-surface-variant" title="Fullscreen"><span class="material-symbols-outlined text-[18px]">fullscreen</span></button>
            <button id="viz-close" class="p-1.5 rounded-lg hover:bg-surface-container text-on-surface-variant" title="Close"><span class="material-symbols-outlined text-[18px]">close</span></button>
          </div>
        </div>
        <div id="viz-body" class="p-md max-h-[46vh] overflow-y-auto"></div>
      </div>
    </section>
  </main>

  <!-- ============================= RIGHT ZOE PANEL (DESKTOP) ============================= -->
  <aside id="zoe-panel" class="hidden md:flex flex-col w-[360px] xl:w-[400px] shrink-0 h-full bg-surface/95 dark:bg-inverse-surface/90 backdrop-blur-2xl border-l border-outline-variant/20 dark:border-outline/10 shadow-[-8px_0_32px_rgba(0,0,0,0.05)] z-30 transition-all duration-300 overflow-hidden">
    <div id="zoe-content" class="flex flex-col h-full"></div>
  </aside>

  <!-- ============================= ZOE MOBILE SHEET ============================= -->
  <div id="zoe-mobile" class="md:hidden fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/40" data-zoe-mobile-close></div>
    <div class="absolute bottom-0 left-0 right-0 top-16 bg-surface dark:bg-inverse-surface rounded-t-3xl flex flex-col overflow-hidden">
      <div class="w-full flex justify-center pt-3 pb-1 cursor-pointer" data-zoe-mobile-close>
        <div class="w-12 h-1.5 bg-outline-variant/50 rounded-full"></div>
      </div>
      <div id="zoe-mobile-content" class="flex-1 flex flex-col overflow-hidden"></div>
    </div>
  </div>

  <!-- ============================= GLOBAL SEARCH MODAL ============================= -->
  <div id="search-modal" class="fixed inset-0 z-[900] hidden">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" data-search-close></div>
    <div class="relative max-w-2xl mx-auto mt-24 glass-panel rounded-2xl overflow-hidden">
      <div class="flex items-center gap-3 px-md py-sm border-b border-outline-variant/20 dark:border-outline/10">
        <span class="material-symbols-outlined text-on-surface-variant">search</span>
        <input id="search-input" class="flex-1 bg-transparent border-none outline-none text-body-lg text-on-surface placeholder-on-surface-variant/50" placeholder="Search Florida locations, screens, assets…" autocomplete="off"/>
        <button data-search-close class="p-1.5 rounded-lg hover:bg-surface-container text-on-surface-variant"><span class="material-symbols-outlined text-[18px]">close</span></button>
      </div>
      <div id="search-results" class="max-h-[50vh] overflow-y-auto p-sm"></div>
    </div>
  </div>

  <!-- ============================= TOASTS ============================= -->
  <div id="toasts" class="fixed bottom-24 md:bottom-6 right-4 md:right-6 z-[950] flex flex-col gap-2 items-end pointer-events-none"></div>

  <!-- ============================= SCRIPT ENTRY POINT ============================= -->
  <script type="module" src="/src/app/core.js"></script>
</body>
</html>
