<img alt="THERMA Logo" class="w-full h-full object-cover mix-blend-screen opacity-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDaJ9l0tWKuwRGX8t9-6vK5FRM6uLQ3tP7Y0vW3SlxmjyuWZfpGHMTbrHTbdM5EqVC3GW-yNeVzRGGGUIyzV5JiM6fVKYdkZef3rMfrUmQxrb1jB0lXLSMOLUeTKiuzO9clDmP1XNZQ6cXdMqMPIfu8TT1JPzJHRxJ9RKuSLKOzVe6CCQzbkZySGa0sWZR_yiqs8b4tVbrZZR-G5Kh6k0GH4ffQdUI1GHQy1cJgAueMrkcIuipAZfKfcg"/>
</div>
<!-- Title -->
<h1 class="font-display-lg text-display-lg text-on-background text-center mb-unit tracking-tighter">
      THERMA
    </h1>
<!-- Subtitle -->
<p class="font-headline-md text-headline-md text-on-surface-variant text-center mb-margin-desktop opacity-80">
      Heat Intelligence Platform
    </p>
<!-- Initialization Status -->
<div class="w-full flex flex-col items-center mt-margin-desktop">
<div class="flex items-center gap-2 text-primary font-data-mono text-data-mono mb-2 uppercase tracking-widest">
<span class="material-symbols-outlined text-[16px] animate-spin">autorenew</span>
<span id="init-text">Initializing thermal intelligence...</span>
</div>
<!-- Progress Bar Container -->
<div class="w-full h-1 bg-surface-container-highest rounded-full overflow-hidden mt-unit relative">
<div class="h-full bg-tertiary w-0 rounded-full shadow-[0_0_10px_rgba(255,181,157,0.5)]" id="progress-bar"></div>
</div>
</div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const progressBar = document.getElementById('progress-bar');
    const initText = document.getElementById('init-text');
    let progress = 0;
    
    const messages = [
      "Establishing geospatial uplink...",
      "Calibrating thermal sensors...",
      "Loading risk matrices...",
      "System ready."
    ];
    let msgIndex = 0;

    const interval = setInterval(() => {
      progress += Math.random() * 15;
      if (progress >= 100) {
        progress = 100;
        clearInterval(interval);
        setTimeout(() => {
            initText.textContent = "Entering Command Center...";
        }, 500);
      }
      
      progressBar.style.width = `${progress}%`;
      
      if (progress > 30 && msgIndex === 0) {
          msgIndex++;
          initText.textContent = messages[msgIndex];
      } else if (progress > 60 && msgIndex === 1) {
          msgIndex++;
          initText.textContent = messages[msgIndex];
      } else if (progress >= 100 && msgIndex === 2) {
          msgIndex++;
          initText.textContent = messages[msgIndex];
          initText.classList.add('text-tertiary');
      }

    }, 250);
  });
</script></main></body></html>
